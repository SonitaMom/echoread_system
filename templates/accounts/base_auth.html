{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}EchoRead{% endblock %}</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/register.css' %}" />
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
  </head>
  <body>
    <main class="min-vh-100 register d-flex align-items-center py-4">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-9 col-xl-8">
            <div class="card register-card">
              <div class="row gy-4 gx-md-5">
                <div
                  class="col-12 col-md-5 text-center text-md-start regis-left-side"
                >
                  <div
                    class="logo d-flex align-items-center justify-content-center justify-content-md-start gap-2"
                  >
                    <object
                      data="{% static 'image/echoread-logo-animated.svg' %}"
                      type="image/svg+xml"
                      class="brand"
                      aria-label="EchoRead Logo"
                    ></object>
                    <span class="text-black title"
                      >Echo<span class="text-primary">Read</span></span
                    >
                  </div>

                  <div class="side-text">
                    <h1 class="mt-3 h1 text-center">Welcome</h1>
                    <p class="mb-0 text-center">
                      Log in, or create a free account in a minute.
                    </p>
                  </div>
                </div>

                <div class="col-12 col-md-7">
                  <div class="my-1 my-md-2 my-lg-5 mx-4">
                    {% block content %}{% endblock %}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

     <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
     
  </body>
</html>
