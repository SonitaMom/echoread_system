{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <h1 class="h3">Document Reader</h1>

    <p>Welcome, {{ request.user.username }}!</p>

    <p>You're logged in successfully.</p>

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-secondary">
            Logout
        </button>
    </form>
</div>
{% endblock %}
