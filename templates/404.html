{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found | EchoRead</title>

    <link rel="stylesheet" href="{% static 'css/404.css' %}">
    <link rel="icon" type="image/svg+xml" href="/static/image/echoread-logo-animated.svg">
</head>

<body>
    <div class="error-container">

        <h1>404</h1>
        <h2>Page Not Found</h2>

        <p>
            Sorry! The page you are looking for doesn't exist
            or has been moved.
        </p>

        <a href="{% url 'home' %}" class="home-btn">
            Back to Home
        </a>

        <img
            src="{% static 'image/echoread-404-v3.svg' %}"
            alt="EchoRead 404 Illustration"
            class="error-image"
        >

    </div>
</body>
</html>
