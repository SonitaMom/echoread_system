{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    {% block js %}
    {% endblock js %}
    <title>EchoReadr - System </title>
</head>
<body>
  <nav class="navbar nav-expand-lg sticky-top navbar-custom">
    <div class="container">

        <!-- Brand -->
         <a href="#" class="navbar-brand d-flex align-items-center justify-content-start gap-2">
            <object type="image/svg+xml" data="{% static 'image/echoread-logo-animated.svg' %}"  class="brand"></object>
            <span class="text-black nav-title">Echo<span class="text-primary">Read</span></span>
         </a>

         <!-- right-side:start reading, En->kh, account -->
          <div class="d-flex align-items-center justify-content-end gap-2 ">
            <button class="btn btn-primary text-white btn-start-reading">{{ 'Start Reading' }}</button>
            <button class="acc-log d-flex align-items-center gap-2 g-sm-1 btn text-white">
              <span class="btn-text">Sign up</span><span class="avatar"><i class="fa-regular fa-circle-user"></i></span>
            </button>
          </div>
    </div>
  </nav>
</body>
</html>
