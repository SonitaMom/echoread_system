{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    {% block js %}
    {% endblock  %}
    <title>EchoReadr - System </title>
</head>
<body>

  <nav class="navbar nav-expand-lg sticky-top navbar-custom">
    <div class="container">

        <!-- Brand -->
         <a href="{% url 'home' %}" class="navbar-brand d-flex align-items-center justify-content-start gap-2">
            <object type="image/svg+xml" data="{% static 'image/echoread-logo-animated.svg' %}"  class="brand"></object>
            <span class="text-black nav-title">Echo<span class="text-primary">Read</span></span>
         </a>

         <!-- right-side:start reading, En->kh, account -->
          <div class="d-flex align-items-center justify-content-end gap-2 ">
            <a class="btn btn-primary text-white btn-start-reading" href="{% url 'reader:help' %}">Help?</a>

            {% if user.is_authenticated %}
              <div class="user-menu">
                <button type="button" class="user-avatar" id="userMenuBtn" aria-expanded="false" aria-controls="userMenuPanel" aria-label="Account menu for {{ user.username }}">
                  {{ user.username|slice:":2"|upper }}
                </button>
               

                <div class="user-menu-panel" id="userMenuPanel" hidden>
                  <div class="fw-semibold text-break">{{ user.username }}</div>

                  <form action="{% url 'logout' %}" method="post" class="m-0 mt-2 d-md-none">
                    {% csrf_token %}
                    <button class="btn btn-outline-secondary w-100" type="submit">Log out </button>
                  </form>
                </div>
              </div>

              <form action="{% url 'logout' %}" method="post" class="m-0 d-none d-md-block">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-secondary">Log out <i class="fa-solid fa-right-from-bracket"></i></button>
              </form>

            {% else %}

            <a href="{% url 'login' %}" class="btn btn-outline-primary">Login</a>
            <a href="{% url 'register' %}" class="acc-log d-flex align-items-center gap-2 btn btn-secondary text-white">
              <span class="btn-text">Sign up</span>
              <span class="avatar"><i class="fa-regular fa-circle-user user-icon"></i></span>
            </a>
            
            {% endif %}
          </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <script src="{% static 'js/login_signup.js' %}"></script>
  <script>
  document.addEventListener("keydown", (event) => {
      const target = event.target;

      // Don't trigger while typing.
      if (
          target.tagName === "INPUT" ||
          target.tagName === "TEXTAREA" ||
          target.isContentEditable
      ) {
          return;
      }

      // Ctrl + / : Open Help
      if (event.ctrlKey && event.key === "/") {
          event.preventDefault();
          window.location.href = "{% url 'reader:help' %}";
      }
  });
  </script>
</body>
</html>
