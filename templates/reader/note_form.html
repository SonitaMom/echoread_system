
{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} - EchoRead</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
<main class="container py-4">
    <a href="{% url 'reader:document_detail' document.pk %}">
        Back to Reader
    </a>

    <h1 class="mt-3">{{ page_title }}</h1>
    <p>PDF: {{ document.title }}</p>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="{{ form.title.id_for_label }}"
                   class="form-label">Title</label>
            {{ form.title }}
            {{ form.title.errors }}
        </div>

        <div class="mb-3">
            <label for="{{ form.text.id_for_label }}"
                   class="form-label">Text</label>
            {{ form.text }}
            {{ form.text.errors }}
        </div>

        <button type="submit" class="btn btn-primary">
            Save Note
        </button>
        <a href="{% url 'reader:document_detail' document.pk %}"
           class="btn btn-outline-secondary">
            Cancel
        </a>
    </form>
</main>
</body>
</html>
