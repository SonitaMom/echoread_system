{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Reader - EchoRead</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
<main class="container py-4">
    <p><a href="/home/">Back to My Readers</a></p>

    <h1>New Reader</h1>
    <p>Select a PDF to create a new reader.</p>

    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}" role="alert">
        {{ message }}
    </div>
    {% endfor %}

    <form method="post" enctype="multipart/form-data" id="upload-form">
        {% csrf_token %}

        <div id="drop-zone"
             class="border border-2 rounded p-5 text-center mb-3"
             tabindex="0"
             role="group"
             aria-label="PDF upload area">
            <p id="file-label">Drop a PDF here or choose a file.</p>

            <input type="file"
                   name="pdf_file"
                   id="pdf-file"
                   class="form-control"
                   accept=".pdf,application/pdf"
                   required>
        </div>

        <button type="submit" class="btn btn-primary">
            Create Reader
        </button>
        <a href="/home/" class="btn btn-outline-secondary">Cancel</a>
    </form>
</main>

<script>
const fileInput = document.getElementById("pdf-file");
const dropZone = document.getElementById("drop-zone");
const fileLabel = document.getElementById("file-label");

fileInput.addEventListener("change", () => {
    if (fileInput.files.length) {
        fileLabel.textContent = "Selected: " + fileInput.files[0].name;
    }
});

dropZone.addEventListener("dragover", event => {
    event.preventDefault();
    dropZone.classList.add("bg-light");
});

dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("bg-light");
});

dropZone.addEventListener("drop", event => {
    event.preventDefault();
    dropZone.classList.remove("bg-light");

    const files = event.dataTransfer.files;
    if (files.length) {
        fileInput.files = files;
        fileInput.dispatchEvent(new Event("change"));
    }
});
</script>
</body>
</html>
