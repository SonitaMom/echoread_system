      <animate attributeName="opacity" values="0.35;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-34 0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M150 60 L85 150 L185 150 M150 60 L150 200" fill="none" stroke="url(#g404)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
