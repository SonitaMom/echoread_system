<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="404 page not found" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g404" x1="0" y1="0" x2="1" y2="1">
