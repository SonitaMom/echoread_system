      <animate attributeName="opacity" values="0.4;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Left 4 with echo trailing to the left -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M150 60 L85 150 L185 150 M150 60 L150 200" fill="none" stroke="#818cf8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <animate attributeName="opacity" values="0.35;0" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-34 0" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </path>
