      <animateTransform attributeName="transform" type="translate" values="0 8;0 -10" dur="2s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="385" y="240" font-size="32" text-anchor="middle" fill="#38bdf8">?
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 8;0 -10" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </text>
    <text x="255" y="215" font-size="20" text-anchor="middle" fill="#4338ca">?
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 8;0 -10" dur="2s" begin="1.3s" repeatCount="indefinite"/>
    </text>
  </g>

