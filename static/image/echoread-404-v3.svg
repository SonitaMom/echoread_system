      <animate attributeName="y1" values="127;127;117;127;127" keyTimes="0;0.15;0.32;0.5;1" dur="2.4s" begin="0.60s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="133;133;143;133;133" keyTimes="0;0.15;0.32;0.5;1" dur="2.4s" begin="0.60s" repeatCount="indefinite"/>
    </line>
    <line x1="336" x2="336" y1="127" y2="133" stroke="#6366f1" stroke-width="6" stroke-linecap="round">
      <animate attributeName="y1" values="127;127;122;127;127" keyTimes="0;0.15;0.32;0.5;1" dur="2.4s" begin="0.72s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="133;133;138;133;133" keyTimes="0;0.15;0.32;0.5;1" dur="2.4s" begin="0.72s" repeatCount="indefinite"/>
