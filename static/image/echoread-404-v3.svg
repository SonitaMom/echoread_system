  <g>
    <circle cx="300" cy="130" r="60" fill="none" stroke="url(#g404)" stroke-width="20"/>
    <line x1="264" x2="264" y1="127" y2="133" stroke="#6366f1" stroke-width="6" stroke-linecap="round">
      <animate attributeName="y1" values="127;127;122;127;127" keyTimes="0;0.15;0.32;0.5;1" dur="2.4s" begin="0.00s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="133;133;138;133;133" keyTimes="0;0.15;0.32;0.5;1" dur="2.4s" begin="0.00s" repeatCount="indefinite"/>
    </line>
    <line x1="276" x2="276" y1="127" y2="133" stroke="#6366f1" stroke-width="6" stroke-linecap="round">
      <animate attributeName="y1" values="127;127;117;127;127" keyTimes="0;0.15;0.32;0.5;1" dur="2.4s" begin="0.12s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="133;133;143;133;133" keyTimes="0;0.15;0.32;0.5;1" dur="2.4s" begin="0.12s" repeatCount="indefinite"/>
