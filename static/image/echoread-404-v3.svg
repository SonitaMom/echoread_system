    <line x1="288" x2="288" y1="127" y2="133" stroke="#6366f1" stroke-width="6" stroke-linecap="round">
      <animate attributeName="y1" values="127;127;112;127;127" keyTimes="0;0.15;0.32;0.5;1" dur="2.4s" begin="0.24s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="133;133;148;133;133" keyTimes="0;0.15;0.32;0.5;1" dur="2.4s" begin="0.24s" repeatCount="indefinite"/>
    </line>
    <line x1="300" x2="300" y1="127" y2="133" stroke="#6366f1" stroke-width="6" stroke-linecap="round">
      <animate attributeName="y1" values="127;127;108;127;127" keyTimes="0;0.15;0.32;0.5;1" dur="2.4s" begin="0.36s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="133;133;152;133;133" keyTimes="0;0.15;0.32;0.5;1" dur="2.4s" begin="0.36s" repeatCount="indefinite"/>
    </line>
    <line x1="312" x2="312" y1="127" y2="133" stroke="#6366f1" stroke-width="6" stroke-linecap="round">
      <animate attributeName="y1" values="127;127;112;127;127" keyTimes="0;0.15;0.32;0.5;1" dur="2.4s" begin="0.48s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="133;133;148;133;133" keyTimes="0;0.15;0.32;0.5;1" dur="2.4s" begin="0.48s" repeatCount="indefinite"/>
    </line>
