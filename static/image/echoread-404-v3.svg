    <line x1="6" y1="-16" x2="6" y2="0" stroke="#312e81" stroke-width="5" stroke-linecap="round"/>

    <!-- left arm (hangs) -->
    <line x1="-13" y1="-38" x2="-15" y2="-24" stroke="#fcd9b6" stroke-width="5" stroke-linecap="round"/>

    <!-- torso -->
    <rect x="-13" y="-44" width="26" height="30" rx="9" fill="#4f46e5"/>
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
      <line x1="-5" y1="-33" x2="-5" y2="-27"/>
      <line x1="0" y1="-36" x2="0" y2="-24"/>
      <line x1="5" y1="-33" x2="5" y2="-27"/>
    </g>

    <!-- right arm + magnifier sweeping around -->
    <g transform="translate(13,-38)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-10;12;-10" dur="1.6s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="17" y2="-8" stroke="#fcd9b6" stroke-width="5" stroke-linecap="round"/>
        <line x1="17" y1="-8" x2="22" y2="-12" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
        <circle cx="30" cy="-19" r="10" fill="#38bdf8" fill-opacity="0.25" stroke="#0f172a" stroke-width="3"/>
        <path d="M24 -22 Q26 -26 30 -26" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      </g>
    </g>

    <!-- head looking left and right -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-10 0 -46;10 0 -46;-10 0 -46" dur="2.4s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
      <circle cx="0" cy="-60" r="16" fill="#fcd9b6"/>
      <path d="M-16 -62 Q-14 -78 0 -78 Q14 -78 16 -62 Q8 -70 0 -68 Q-8 -70 -16 -62 Z" fill="#1e1b4b"/>
      <g fill="#1e1b4b">
        <ellipse cx="-5.5" cy="-60" rx="2.2" ry="2.8">
          <animate attributeName="ry" values="2.8;2.8;0.3;2.8;2.8" keyTimes="0;0.45;0.5;0.55;1" dur="2.4s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="5.5" cy="-60" rx="2.2" ry="2.8">
          <animate attributeName="ry" values="2.8;2.8;0.3;2.8;2.8" keyTimes="0;0.45;0.5;0.55;1" dur="2.4s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <circle cx="-10" cy="-54" r="2.5" fill="#fda4af" opacity="0.7"/>
      <circle cx="10" cy="-54" r="2.5" fill="#fda4af" opacity="0.7"/>
      <!-- confused mouth -->
      <path d="M-4 -51 Q-1 -54 1 -51 Q3 -48 5 -51" fill="none" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>
      <!-- headphones -->
      <path d="M-18 -62 Q-18 -82 0 -82 Q18 -82 18 -62" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
      <rect x="-22" y="-68" width="8" height="14" rx="4" fill="#38bdf8"/>
      <rect x="14" y="-68" width="8" height="14" rx="4" fill="#38bdf8"/>
    </g>
