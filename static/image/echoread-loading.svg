<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 105 490 120" width="490" height="120" role="img" aria-label="Loading" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <clipPath id="barClip">
      <rect x="100" y="200" width="400" height="14" rx="7"/>
    </clipPath>
  </defs>

  <!-- Bar track -->
  <rect x="100" y="200" width="400" height="14" rx="7" fill="#e2e8f0"/>

  <!-- Bar fill -->
  <g clip-path="url(#barClip)">
    <rect x="100" y="200" width="0" height="14" fill="url(#barGrad)">
      <animate attributeName="width" values="0;400;400" keyTimes="0;0.9;1" dur="4s" calcMode="spline" keySplines="0.4 0 0.6 1;0 0 1 1" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Avatar running along the bar -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="100 200;500 200;500 200" keyTimes="0;0.9;1" dur="4s" calcMode="spline" keySplines="0.4 0 0.6 1;0 0 1 1" repeatCount="indefinite"/>

    <!-- bouncing body -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.4s" repeatCount="indefinite"/>

      <!-- legs -->
      <g transform="translate(-6,-16)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-28;28;-28" dur="0.4s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="16" stroke="#312e81" stroke-width="5" stroke-linecap="round"/>
        </g>
      </g>
      <g transform="translate(6,-16)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="28;-28;28" dur="0.4s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="16" stroke="#312e81" stroke-width="5" stroke-linecap="round"/>
        </g>
      </g>

      <!-- arms -->
      <g transform="translate(-13,-38)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="30;-30;30" dur="0.4s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="14" stroke="#fcd9b6" stroke-width="5" stroke-linecap="round"/>
        </g>
      </g>
      <g transform="translate(13,-38)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-30;30;-30" dur="0.4s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="14" stroke="#fcd9b6" stroke-width="5" stroke-linecap="round"/>
        </g>
      </g>

      <!-- torso -->
      <rect x="-13" y="-44" width="26" height="30" rx="9" fill="#4f46e5"/>
      <!-- sound-wave badge on shirt -->
      <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
        <line x1="-5" y1="-33" x2="-5" y2="-27"/>
        <line x1="0" y1="-36" x2="0" y2="-24"/>
        <line x1="5" y1="-33" x2="5" y2="-27"/>
      </g>

      <!-- head -->
      <circle cx="0" cy="-60" r="16" fill="#fcd9b6"/>
      <!-- hair -->
      <path d="M-16 -62 Q-14 -78 0 -78 Q14 -78 16 -62 Q8 -70 0 -68 Q-8 -70 -16 -62 Z" fill="#1e1b4b"/>
      <!-- eyes (blink) -->
      <g fill="#1e1b4b">
        <ellipse cx="-5.5" cy="-60" rx="2.2" ry="2.8">
          <animate attributeName="ry" values="2.8;2.8;0.3;2.8;2.8" keyTimes="0;0.45;0.5;0.55;1" dur="2.4s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="5.5" cy="-60" rx="2.2" ry="2.8">
          <animate attributeName="ry" values="2.8;2.8;0.3;2.8;2.8" keyTimes="0;0.45;0.5;0.55;1" dur="2.4s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <!-- cheeks + smile -->
      <circle cx="-10" cy="-54" r="2.5" fill="#fda4af" opacity="0.7"/>
      <circle cx="10" cy="-54" r="2.5" fill="#fda4af" opacity="0.7"/>
      <path d="M-5 -53 Q0 -48 5 -53" fill="none" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>

      <!-- headphones -->
      <path d="M-18 -62 Q-18 -82 0 -82 Q18 -82 18 -62" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
      <rect x="-22" y="-68" width="8" height="14" rx="4" fill="#38bdf8"/>
      <rect x="14" y="-68" width="8" height="14" rx="4" fill="#38bdf8"/>

      <!-- sound waves coming off the headphones -->
      <g fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round">
        <path d="M28 -66 Q33 -61 28 -56">
          <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0s" repeatCount="indefinite"/>
        </path>
        <path d="M34 -70 Q42 -61 34 -52">
          <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.25s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- ground shadow -->
    <ellipse cx="0" cy="1" rx="14" ry="3" fill="#0f172a" opacity="0.15">
      <animate attributeName="rx" values="14;10;14" dur="0.4s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- finish flag -->
  <g transform="translate(500,200)">
    <line x1="14" y1="0" x2="14" y2="-34" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M14 -34 L34 -28 L14 -22 Z" fill="#38bdf8">
      <animate attributeName="d" values="M14 -34 L34 -28 L14 -22 Z;M14 -34 L34 -30 L14 -22 Z;M14 -34 L34 -28 L14 -22 Z" dur="0.8s" repeatCount="indefinite"/>
    </path>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
